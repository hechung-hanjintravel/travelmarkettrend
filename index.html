              {(currentWeekData.summaryHighlights || []).map((hl, idx) => (
                <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200/80">
                  <span className="text-xs font-bold px-2 py-0.5 bg-blue-100 text-blue-700 rounded mb-2 inline-block">
                    {hl.tag}
                  </span>
                  <h3 className="text-sm font-bold text-slate-900 mb-1">{hl.title}</h3>
                  <p className="text-xs text-slate-600 leading-relaxed">{hl.desc}</p>
                </div>
              ))}
            </div>
          </section>

          {/* KPI Cards */}
          <section className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div onClick={() => setActiveTab('newspaper')} className="p-4 rounded-2xl border bg-white border-slate-200 hover:border-blue-400 cursor-pointer transition">
              <div className="text-xs font-bold text-blue-600 mb-1">신문광고</div>
              <div className="text-2xl font-black text-slate-900">{(currentWeekData.newspaperAds || []).length}<span className="text-sm font-medium text-slate-500 ml-1">건</span></div>
            </div>
            <div onClick={() => setActiveTab('biztalk')} className="p-4 rounded-2xl border bg-white border-slate-200 hover:border-amber-400 cursor-pointer transition">
              <div className="text-xs font-bold text-amber-600 mb-1">카카오 비즈톡</div>
              <div className="text-2xl font-black text-slate-900">{(currentWeekData.bizTalkItems || []).length}<span className="text-sm font-medium text-slate-500 ml-1">건</span></div>
            </div>
            <div onClick={() => setActiveTab('promo')} className="p-4 rounded-2xl border bg-white border-slate-200 hover:border-emerald-400 cursor-pointer transition">
              <div className="text-xs font-bold text-emerald-600 mb-1">타사 주요 프로모션</div>
              <div className="text-2xl font-black text-slate-900">{(currentWeekData.competitorPromos || []).length}<span className="text-sm font-medium text-slate-500 ml-1">건</span></div>
            </div>
            <div onClick={() => setActiveTab('edm')} className="p-4 rounded-2xl border bg-white border-slate-200 hover:border-purple-400 cursor-pointer transition">
              <div className="text-xs font-bold text-purple-600 mb-1">E-DM</div>
              <div className="text-2xl font-black text-slate-900">{(currentWeekData.edmCampaigns || []).length}<span className="text-sm font-medium text-slate-500 ml-1">건</span></div>
            </div>
          </section>

          {/* Navigation Tabs */}
          <div className="flex items-center gap-2 border-b border-slate-200 pb-2 overflow-x-auto">
            {[
              { id: "all", label: "전체 영역 종합" },
              { id: "newspaper", label: `신문광고 (${filteredNews.length})` },
              { id: "biztalk", label: `카카오 비즈톡 (${filteredBizTalk.length})` },
              { id: "promo", label: `타사 주요 프로모션 (${filteredPromos.length})` },
              { id: "edm", label: `E-DM (${filteredEdm.length})` }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-3.5 py-1.5 text-xs font-bold rounded-lg transition whitespace-nowrap ${
                  activeTab === tab.id
                    ? "bg-slate-900 text-white shadow-sm"
                    : "text-slate-500 hover:bg-slate-100"
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* 1. Newspaper Section */}
          {(activeTab === 'all' || activeTab === 'newspaper') && (
            <section className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
              <h2 className="text-base font-bold text-slate-900 mb-3 flex items-center gap-2">
                <i data-lucide="newspaper" className="w-5 h-5 text-blue-600"></i>
                1. 신문광고 동향
              </h2>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-slate-50 text-slate-500 border-y border-slate-200">
                      <th className="py-2.5 px-3.5 font-bold">게재일</th>
                      <th className="py-2.5 px-3.5 font-bold">매체</th>
                      <th className="py-2.5 px-3.5 font-bold">여행사</th>
                      <th className="py-2.5 px-3.5 font-bold">광고 타이틀 및 주요 상품 내용</th>
                      <th className="py-2.5 px-3.5 font-bold text-center">지면 이미지</th>
                      <th className="py-2.5 px-3.5 font-bold text-right">포지셔닝</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredNews.map(ad => (
                      <tr key={ad.id} className="hover:bg-slate-50 transition">
                        <td className="py-3 px-3.5 font-semibold text-slate-700 whitespace-nowrap">{ad.date}</td>
                        <td className="py-3 px-3.5 whitespace-nowrap">
                          <span className="px-2 py-0.5 bg-slate-100 text-slate-700 rounded font-medium">{ad.media}</span>
                        </td>
                        <td className="py-3 px-3.5 whitespace-nowrap font-bold text-red-600">{ad.agency}</td>
                        <td className="py-3 px-3.5">
                          <div className="font-bold text-slate-900 text-xs mb-0.5">{ad.title}</div>
                          <div className="text-slate-500 text-[11px] leading-relaxed">{ad.details}</div>
                        </td>
                        {/* 지면 이미지 보기 버튼 */}
                        <td className="py-3 px-3.5 text-center whitespace-nowrap">
                          {ad.imageUrl ? (
                            <button
                              onClick={() => setSelectedImage({ title: ad.title, media: ad.media, url: ad.imageUrl })}
                              className="inline-flex items-center gap-1 px-2.5 py-1 text-[11px] font-bold bg-blue-50 text-blue-600 border border-blue-200 rounded-lg hover:bg-blue-100 transition"
                            >
                              🖼️ 지면 보기
                            </button>
                          ) : (
                            <span className="text-slate-300 text-[11px]">미첨부</span>
                          )}
                        </td>
                        <td className="py-3 px-3.5 text-right whitespace-nowrap">
                          <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${ad.badgeColor}`}>{ad.badge}</span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>
          )}

          {/* 2. BizTalk Section */}
          {(activeTab === 'all' || activeTab === 'biztalk') && (
            <section className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
              <h2 className="text-base font-bold text-slate-900 mb-3 flex items-center gap-2">
                <i data-lucide="message-square" className="w-5 h-5 text-amber-500"></i>
                2. 주간 카카오 비즈톡 발송 현황
              </h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {filteredBizTalk.map(talk => (
                  <div key={talk.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50/50">
                    <div className="flex items-center justify-between mb-2 pb-2 border-b border-slate-200">
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 text-[11px] font-bold rounded bg-amber-100 text-amber-800">
                          {talk.agency}
                        </span>
                        <span className="text-xs font-semibold text-slate-500">{talk.date} {talk.time}</span>
                      </div>
                      <span className="text-[11px] px-2 py-0.5 bg-slate-200 text-slate-600 rounded">{talk.format}</span>
                    </div>
                    <div className="mb-2">
                      <span className="text-[11px] font-bold text-amber-600 mr-1">[{talk.category}]</span>
                      <span className="text-xs font-extrabold text-slate-900">{talk.headline}</span>
                    </div>
                    <ul className="space-y-1 bg-white p-2.5 rounded-lg border border-slate-100">
                      {talk.items.map((line, idx) => (
                        <li key={idx} className="text-xs text-slate-600 flex items-start gap-1.5">
                          <span className="text-amber-500 font-bold">•</span>
                          <span>{line}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* 3. Competitor Promotions */}
          {(activeTab === 'all' || activeTab === 'promo') && (
            <section className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
              <h2 className="text-base font-bold text-slate-900 mb-3 flex items-center gap-2">
                <i data-lucide="tag" className="w-5 h-5 text-emerald-500"></i>
                3. 타사 주요 프로모션
              </h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {filteredPromos.map(promo => (
                  <div key={promo.id} className="p-4 rounded-xl border-2 border-emerald-500/30 bg-emerald-50/30">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-bold text-slate-700">{promo.agency}</span>
                      <span className="text-[11px] font-semibold px-2 py-0.5 bg-white rounded text-emerald-700">{promo.type}</span>
                    </div>
                    <h3 className="text-sm font-extrabold text-slate-900 mb-1">{promo.title}</h3>
                    <div className="text-[11px] text-slate-500 mb-2">기간: {promo.period}</div>
                    <div className="space-y-1 border-t border-slate-200 pt-2">
                      {promo.benefits.map((b, idx) => (
                        <div key={idx} className="text-xs text-slate-700 flex items-start gap-1.5">
                          <span className="text-emerald-500 font-bold">•</span>
                          <span>{b}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* 4. E-DM Section */}
          {(activeTab === 'all' || activeTab === 'edm') && (
            <section className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
              <h2 className="text-base font-bold text-slate-900 mb-3 flex items-center gap-2">
                <i data-lucide="send" className="w-5 h-5 text-purple-600"></i>
                4. E-DM 캠페인
              </h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {filteredEdm.map(edm => (
                  <div key={edm.id} className="p-3 rounded-xl border border-slate-200 bg-slate-50/60">
                    <div className="flex items-center justify-between text-[11px] mb-1">
                      <span className="font-bold text-purple-600">{edm.agency}</span>
                      <span className="text-slate-400">{edm.date}</span>
                    </div>
                    <div className="text-xs font-bold text-slate-800 mb-1">{edm.title}</div>
                    <div className="text-[11px] text-slate-500 mb-2">{edm.desc}</div>
                    <span className="inline-block px-2 py-0.5 text-[10px] font-semibold bg-purple-100 text-purple-700 rounded">#{edm.tag}</span>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* 지면 이미지 팝업 모달 */}
          {selectedImage && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-4xl w-full p-4 max-h-[90vh] flex flex-col shadow-2xl">
                <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                  <div className="font-bold text-sm text-slate-800">
                    [{selectedImage.media}] {selectedImage.title}
                  </div>
                  <button 
                    onClick={() => setSelectedImage(null)}
                    className="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold"
                  >
                    ✕ 닫기
                  </button>
                </div>
                <div className="flex-1 overflow-auto p-4 flex justify-center bg-slate-100 rounded-xl mt-3">
                  <img 
                    src={selectedImage.url} 
                    alt={selectedImage.title}
                    className="max-w-full h-auto rounded shadow-lg"
                    onError={(e) => {
                      e.target.onerror = null;
                      e.target.src = "https://via.placeholder.com/600x800?text=images+폴더의+파일명을+확인해주세요";
                    }}
                  />
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-8 pt-4 border-t border-slate-200 text-center text-[11px] text-slate-400">
            <p>© 2026 Travel Market Trends Intelligence. 경영진 내부 보고용 자료입니다.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
